<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Conversion</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="hero">
    <h1>Metric/Imperial Unit Conversion</h1>
    <input type="text" id="input-el" placeholder="0">
    <button id="convert-btn">Convert</button>
  </div>
  <div class="main">
    <div class="length">
      <h2>Length (Meters/Feet)</h2>
      <p id="length-el">0 meters = 0.000 feet | 0 feet = 0.000 meters</p>
    </div>
    <div class="volume">
      <h2>Volume (Liters/Gallons)</h2>
      <p id="volume-el">0 liters = 0.000 gallons | 0 gallons = 0.000 liters</p>
    </div>
    <div class="mass">
      <h2>Mass (Kilograms/Pounds)</h2>
      <p id="mass-el">0 kilograms = 0.000 pounds | 0 pounds = 0.000 kilograms</p>
    </div>
  </div>
  <script src="index.js"></script>
</body>

</html>
